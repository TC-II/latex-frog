# Workspace de la app. Los spikes de F0 (spikes/*) tienen su propio Cargo.toml y su propio Cargo.lock: se excluyen
# a propósito, o cargo los toma por miembros y falla con "current package believes it's in a workspace".
[workspace]
resolver = "2"
members = ["crates/lv-core", "src-tauri"]
exclude = ["spikes/s2-synctex", "spikes/s3-pdfjs/src-tauri"]

[profile.release]
debug = false

# `tauri dev` compila en el perfil dev. Sin optimizar, el core sumaba ~7 s a cada build del libro (md5 de las figuras, índice del
# proyecto, piezas): medido con el ejemplo `build` tras agregar un párrafo, 10,9 s en debug contra 3,4 s en release con el mismo
# TeX de 2,8 s. El core y sus dependencias van optimizados también en desarrollo; la app (src-tauri) sigue en debug para
# recompilar rápido.
[profile.dev.package.lv-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
